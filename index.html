<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Kitchens</title>
<meta name="description" content="Erin's Kitchen and Mulberry Kitchen: two recipe boxes sharing one recipe library.">
<link rel="icon" type="image/jpeg" href="people/chef.jpg">
<link rel="apple-touch-icon" href="people/chef.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<link rel="stylesheet" href="app/app.css">
<style>
/* Mulberry's card wears its Blue plate theme (same colors as mulberry/theme.css; keep them in step).
   Scoped to the card, so the rest of this page and Erin's card stay as they are. */
.person.blueplate {
  --bg: #f3f5f8; --surface: #ffffff; --ink: #172a46; --muted: #57667c; --rule: #d7dfe9;
  --scallion: #2d68b0; --yolk: #f4c95d; --chip: #e6ecf4;
  color: var(--ink); background: var(--chip);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .person.blueplate {
    --bg: #0e1420; --surface: #161e2c; --ink: #e3eaf5; --muted: #a2b0c4; --rule: #283448;
    --scallion: #7fb0ec; --yolk: #f4cd6a; --chip: #1f2a3c;
  }
}
:root[data-theme="dark"] .person.blueplate {
  --bg: #0e1420; --surface: #161e2c; --ink: #e3eaf5; --muted: #a2b0c4; --rule: #283448;
  --scallion: #7fb0ec; --yolk: #f4cd6a; --chip: #1f2a3c;
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">One shared recipe library</span>
    <h1>Our Kitchens</h1>
  </header>
  <div class="people">
    <a class="person" href="erin/"><img src="people/chef.jpg" alt="" width="72" height="72"><div><h2>Erin's Kitchen</h2><span class="meta">Erin's recipe box</span></div></a>
    <a class="person blueplate" href="mulberry/"><img src="people/chef.jpg" alt="" width="72" height="72"><div><h2>Mulberry Kitchen</h2><span class="meta">Mulberry's recipe box</span></div></a>
  </div>
</div>
</body>
</html>
