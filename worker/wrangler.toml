# Cloudflare Worker settings for the kitchen helper.
# Secrets are NOT stored here. Add them with:  npx wrangler@4 secret put NAME
#   ANTHROPIC_API_KEY, GITHUB_TOKEN, PASSCODES  (PASSCODES is JSON: {"erin": "...", "mulberry": "..."})
name = "kitchen-helper"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Never remove variables set in the Cloudflare dashboard when deploying.
keep_vars = true

[vars]
GITHUB_REPO = "AirPengwn/kitchen"
GITHUB_BRANCH = "main"
# Sites allowed to call the helper (comma-separated, no trailing slash).
ALLOWED_ORIGINS = "https://airpengwn.github.io"
# Which Claude model reads recipes, and how hard it thinks (low, medium, high).
MODEL = "claude-opus-5-5"
EFFORT = "medium"
